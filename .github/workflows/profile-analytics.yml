name: Update profile analytics

on:
  schedule:
    - cron: "17 06 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_analytics.py
      - .github/workflows/profile-analytics.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generate analytics card
        run: python scripts/generate_analytics.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish updated metrics
        run: |
          if git diff --quiet -- assets/github-analytics.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-analytics.svg
          git commit -m "Update profile analytics"
          git push
